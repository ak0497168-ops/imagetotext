<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Image Text Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- =========================================
         API Key Setup Screen (shown when no key)
         ========================================= -->
    <div id="setup-screen" class="screen hidden">
      <div class="setup-header">
        <div class="logo">
          <span class="logo-icon">🔍</span>
          <span class="logo-text">OCR Extractor</span>
        </div>
        <p class="setup-subtitle">Paste your OCR.space API key to get started</p>
      </div>

      <div class="setup-body">
        <div class="field-group">
          <label class="field-label" for="api-key-input">OCR.space API Key</label>
          <div class="input-row">
            <input
              type="password"
              id="api-key-input"
              class="text-input"
              placeholder="Paste your API key here…"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="toggle-key-visibility" class="icon-btn" title="Show/Hide key">👁</button>
          </div>
          <span class="field-hint">
            Get a free key at
            <a href="https://ocr.space/ocrapi" target="_blank" rel="noopener">ocr.space/ocrapi</a>
          </span>
        </div>

        <div id="setup-error" class="status-msg status-msg--error hidden"></div>

        <button id="save-key-btn" class="btn btn--primary btn--full">
          Save &amp; Continue →
        </button>
      </div>
    </div>

    <!-- =========================================
         Main OCR Screen
         ========================================= -->
    <div id="main-screen" class="screen hidden">
      <!-- Header -->
      <div class="header">
        <div class="logo">
          <span class="logo-icon">🔍</span>
          <span class="logo-text">OCR Extractor</span>
        </div>
        <button id="settings-btn" class="icon-btn" title="Change API Key">⚙️</button>
      </div>

      <!-- Drop Zone / Image Preview -->
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Drop image here or click to upload">
        <div id="drop-zone-placeholder" class="drop-placeholder">
          <span class="drop-icon">🖼️</span>
          <span class="drop-text">Drop image here</span>
          <span class="drop-subtext">or use a button below</span>
        </div>
        <img id="preview-img" class="preview-img hidden" alt="Image preview" />
        <input type="file" id="file-input" accept="image/*" class="hidden" />
      </div>

      <!-- Action Buttons -->
      <div class="action-row">
        <button id="upload-btn" class="btn btn--secondary" title="Upload image file">
          📁 Upload Image
        </button>
        <button id="screenshot-btn" class="btn btn--accent" title="Select a screen region and extract text via OCR">
          📷 Screenshot OCR
        </button>
      </div>

      <!-- Status Message -->
      <div id="status-msg" class="status-msg hidden"></div>

      <!-- Result Area -->
      <div id="result-section" class="result-section hidden">
        <div class="result-header">
          <span class="result-label">Extracted Text</span>
          <div class="result-actions">
            <button id="copy-result-btn" class="btn btn--xs btn--primary">Copy</button>
            <button id="clear-btn" class="btn btn--xs btn--danger">Clear</button>
          </div>
        </div>
        <textarea
          id="result-textarea"
          class="result-textarea"
          placeholder="Extracted text will appear here…"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- OCR Button -->
      <div class="ocr-row">
        <button id="ocr-btn" class="btn btn--primary btn--full" disabled>
          <span id="ocr-btn-text">🔍 Extract Text (OCR)</span>
          <span id="ocr-btn-spinner" class="spinner hidden"></span>
        </button>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
